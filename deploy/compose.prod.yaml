# Production stack for the site on the Hetzner server, next to the API stack (fatwarag-prod).
#
# Releases are automatic: a push to main runs CI, which publishes the image and runs deploy.sh on the server
# (in /srv/fatwarag-web, next to .env.production). The site joins the API stack's network, so:
#   - it calls the API directly at http://app:8080 (no trip through Cloudflare, so the edge rate limit on
#     /api/v1/search never sees the site's own requests), and
#   - the API stack's Cloudflare Tunnel routes fatwarag.com to http://web:3000. No port is opened to the internet.

name: fatwarag-web

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/ahmed-fawzy99/fatwarag-web:latest}
    env_file: .env.production
    environment:
      API_URL: http://app:8080/api/v1
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000" # for checks on the host only
    networks: [api]
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  api:
    name: fatwarag-prod_default
    external: true
